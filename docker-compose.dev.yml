x-criclive-environment: &criclive-environment
  LIVE_FEED_PROVIDER: criclive
  PROVIDER_TYPE: criclive
  CRICLIVE_MODE: ${CRICLIVE_MODE:-live}
  CRICLIVE_API_TOKEN: ${CRICLIVE_API_TOKEN:-}
  CRICLIVE_BASE_URL: ${CRICLIVE_BASE_URL:-https://cricketliveapi.com/api/v1}
  CRICLIVE_POLL_INTERVAL: ${CRICLIVE_POLL_INTERVAL:-8s}
  CRICLIVE_DISCOVERY_INTERVAL: ${CRICLIVE_DISCOVERY_INTERVAL:-60s}
  CRICLIVE_LEASE_TTL: ${CRICLIVE_LEASE_TTL:-30s}

services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - --eval
      - "try { rs.status() } catch (_) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }; while (!db.hello().isWritablePrimary) { sleep(500) }"

  api:
    build: ./backend
    image: crikoptions-backend:dev
    command: ["/api"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      <<: *criclive-environment
      PORT: "8080"
      MONGO_DB: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB_NAME: crikoptions
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      ALLOWED_ORIGINS: http://localhost:3000
      SIMULATOR_ENABLED: "false"
    ports:
      - "8080:8080"

  feedworker:
    build: ./backend
    image: crikoptions-backend:dev
    command: ["/feedworker"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      <<: *criclive-environment
      MONGO_DB: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB_NAME: crikoptions

volumes:
  mongo-data:
